<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>비나세이프 · 채팅</title>
<style>
  :root {
    --navy: #10294a; --navy2: #1b3b66; --teal: #0e9aa7; --teal-dark: #0a7a85;
    --bg: #eaf0f6; --card: #ffffff; --text: #1d2733; --sub: #66758a; --line: #d6dfea;
    --warn-bg: #fff6dd; --warn-line: #eeb12c; --warn-text: #7a5200;
    --danger-bg: #fde8e6; --danger-line: #d93025; --danger-text: #96150d;
    --ok-bg: #e4f6ea; --ok-line: #2f9e5b; --ok-text: #17673a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    line-height: 1.55; display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 760px; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; background: var(--bg);
  }
  /* 헤더 */
  header { background: linear-gradient(135deg, var(--navy), var(--navy2)); color: #fff; padding: 12px 16px 10px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--teal); display: grid; place-items: center; font-weight: 800; font-size: 1.05rem; }
  .brand h1 { font-size: 1.15rem; margin: 0; line-height: 1.2; }
  .brand p { margin: 0; font-size: .78rem; opacity: .8; }
  .sample { margin-top: 8px; font-size: .76rem; background: rgba(255,255,255,.12); border-radius: 8px; padding: 6px 10px; }
  /* 탭 + 공정 */
  .bar { background: #fff; border-bottom: 1px solid var(--line); padding: 8px 12px 10px; }
  .seg { display: flex; background: #e6edf5; border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; font: inherit; font-weight: 700; color: var(--sub); padding: 9px 6px; border-radius: 8px; cursor: pointer; min-height: 40px; }
  .seg button[aria-selected="true"] { background: #fff; color: var(--navy); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .procs { display: flex; gap: 6px; overflow-x: auto; padding-top: 9px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .procs::-webkit-scrollbar { display: none; }
  .procs button { flex: 0 0 auto; border: 1px solid var(--line); background: #fff; color: var(--text); font: inherit; font-size: .86rem; padding: 7px 13px; border-radius: 999px; cursor: pointer; min-height: 36px; white-space: nowrap; }
  .procs button[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 700; }
  /* 본문 */
  main { flex: 1; overflow-y: auto; padding: 14px 12px; -webkit-overflow-scrolling: touch; }
  .msg { display: flex; margin-bottom: 12px; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 88%; padding: 10px 13px; border-radius: 16px; font-size: .98rem; word-break: keep-all; overflow-wrap: anywhere; }
  .msg.user .bubble { background: var(--teal); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; width: 88%; }
  .bubble.plain { width: auto; }
  .ptag { font-size: .72rem; opacity: .8; margin-bottom: 2px; }
  .banner { border: 2px solid; border-radius: 10px; padding: 9px 11px; margin-bottom: 9px; font-weight: 700; font-size: .93rem; }
  .banner.danger { background: var(--danger-bg); border-color: var(--danger-line); color: var(--danger-text); }
  .banner.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-text); }
  .banner.info { background: #eef3f9; border-color: var(--line); color: var(--sub); font-weight: 400; }
  .ans { margin: 0; padding: 0; list-style: none; }
  .ans li { position: relative; padding: 3px 0 3px 18px; }
  .ans li::before { content: ""; position: absolute; left: 3px; top: .85em; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); }
  .note { font-size: .83rem; color: var(--sub); margin-top: 6px; }
  details.src { margin-top: 9px; }
  details.src summary { cursor: pointer; font-weight: 700; font-size: .86rem; color: var(--navy2); padding: 6px 0; min-height: 36px; }
  .card { border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: 8px; padding: 8px 10px; margin: 6px 0; background: #f8fbfd; }
  .card.ref { border-left-color: #b8c4d3; background: #fafbfc; }
  .card .n { font-weight: 700; font-size: .86rem; }
  .card .c { color: var(--sub); font-size: .8rem; }
  .card blockquote { margin: 5px 0 0; font-size: .88rem; }
  .rate { display: flex; align-items: center; gap: 7px; margin-top: 8px; flex-wrap: wrap; }
  .rate span { font-size: .82rem; color: var(--sub); }
  .rate button { font-size: 1.05rem; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 12px; cursor: pointer; min-height: 40px; }
  .rate button[aria-pressed="true"] { background: #dff0fb; border-color: var(--teal); }
  .rate .thx { color: var(--ok-text); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 8px 0 0; }
  .chip { border: 1px solid var(--teal); color: var(--teal-dark); background: #fff; font: inherit; font-size: .86rem; padding: 7px 12px; border-radius: 999px; cursor: pointer; min-height: 38px; }
  .chip:hover { background: #e6f6f8; }
  .typing .bubble { display: flex; gap: 5px; padding: 14px 16px; width: auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #a9b6c6; animation: bl 1s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: .15s; } .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bl { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  /* 입력창 */
  .composer { background: #fff; border-top: 1px solid var(--line); padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
  .composer .row { display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { flex: 1; font: inherit; font-size: 16px; border: 1px solid var(--line); border-radius: 14px; padding: 10px 13px; resize: none; max-height: 120px; min-height: 44px; background: #f7fafc; color: var(--text); }
  .send { border: 0; background: var(--teal); color: #fff; font: inherit; font-weight: 700; border-radius: 14px; padding: 0 18px; min-height: 44px; cursor: pointer; }
  .send:disabled { background: #b6c3d1; cursor: not-allowed; }
  .tools { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: .74rem; color: var(--sub); }
  .tools button { border: 0; background: transparent; color: var(--sub); font: inherit; font-size: .76rem; text-decoration: underline; cursor: pointer; padding: 4px; }
  textarea:focus, button:focus-visible, summary:focus-visible { outline: 3px solid #8fd0d6; outline-offset: 1px; }
  /* 체크리스트 */
  .ck-head { font-weight: 800; font-size: 1.05rem; margin: 2px 2px 4px; }
  .ck-sub { font-size: .84rem; color: var(--sub); margin: 0 2px 10px; }
  .group-t { font-size: .8rem; font-weight: 800; color: var(--teal-dark); margin: 12px 2px 6px; letter-spacing: .02em; }
  .ck { display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
  .ck input { width: 22px; height: 22px; margin-top: 2px; flex-shrink: 0; accent-color: var(--teal); }
  .ck.done { background: var(--ok-bg); border-color: var(--ok-line); }
  .ck .t { font-weight: 700; }
  .ck .s { font-size: .8rem; color: var(--sub); margin-top: 3px; }
  .meter { height: 8px; background: #d7e1ec; border-radius: 99px; overflow: hidden; margin: 2px 2px 4px; }
  .meter i { display: block; height: 100%; width: 0; background: var(--teal); transition: width .25s; }
  .ready { margin-top: 12px; text-align: center; font-weight: 800; font-size: 1.1rem; padding: 15px; border-radius: 12px; background: var(--ok-bg); border: 2px solid var(--ok-line); color: var(--ok-text); }
  .hidden { display: none !important; }
  @media (max-width: 480px) { .bubble { max-width: 94%; } .msg.bot .bubble { width: 94%; } }
</style>

<body>
<div class="app">
  <header>
    <div class="brand">
      <div><h1 id="appName"><span class="vs-a">VINA</span><span class="vs-b">Safe</span></h1><p>신입 작업자를 위한 공정 Q&amp;A · 안전 체크리스트</p></div>
    </div>
    <div class="sample">시제품 · 공정 문서는 모두 <b>샘플 데이터</b>이며 실제 규정이 아닙니다. <b>법령</b>·<b>교수님 인터뷰</b> 배지가 붙은 근거는 샘플이 아닌 실제 법령 조문·인터뷰 내용입니다.</div>
  </header>

  <div class="bar">
    <div class="seg" role="tablist">
      <button role="tab" id="tab-chat" aria-selected="true">💬 대화</button>
      <button role="tab" id="tab-check" aria-selected="false">✅ 안전 체크리스트</button>
    </div>
    <div class="procs" id="procs" role="group" aria-label="공정 선택"></div>
  </div>

  <main id="main"></main>

  <div class="composer" id="composer">
    <div class="row">
      <textarea id="input" rows="1" placeholder="궁금한 것을 입력하세요" aria-label="질문 입력"></textarea>
      <button class="send" id="send" disabled>전송</button>
    </div>
    <div class="tools"><span id="procLabel">공정: 전체 · Enter 전송 / Shift+Enter 줄바꿈</span><button id="clear" type="button">대화 지우기</button></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var PROCESSES = ["전체", "전극 코팅", "셀 조립", "전해액 주입·밀봉", "충방전·내전압 시험", "품질검사(QC)", "모듈 조립"];
  var FAQS = ["극성을 반대로 연결했으면?", "충방전 시간은 왜 지켜야 해?", "필수 보호구는?", "위험하면 작업 멈춰도 돼요?", "괴롭힘 신고하면 불이익 있어요?", "신입이 하지 말아야 할 것은?"];

  var CONCEPTS = {
    polarity: ["극성", "플러스", "마이너스", "양극단자", "음극단자"],

    vent: ["환기", "배기", "후드"],

    statics: ["정전기", "조립실", "입실", "복장"],
    humidity: ["습도", "이슬점", "드라이룸"],
    foreign: ["이물", "주머니", "장신구", "반지", "시계", "금속"],
    short: ["단락", "쇼트", "절연공구", "공구"],
    calib: ["교정", "계측기", "측정기", "캘리브"],
    lot: ["로트", "lot", "이력"],
    reject: ["불합격", "부적합", "분리보관", "불량품"],
    abnormal: ["이상발견", "이상을발견", "이상이있", "이상이생", "불량발견"],
    emfac: ["비상샤워", "세안기", "비상구", "대피"],
    ppecheck: ["손상", "기한", "유효", "파손", "보호구점검"],

    if (hits.length > 3) notes.push("관련 문서가 " + hits.length + "개 있어 3개만 보여드려요. 공정을 고르면 더 정확해져요.");
    return { status: "OK", emergency: emergency, answer: answer, sources: shown.map(toSrc), related: [], note: notes.join(" ") };
  }

  /* ===== 대화 화면 ===== */
  function scrollDown() { main.scrollTop = main.scrollHeight; }
  function addUser(text) {

  }
  function faqChips() {

  }
  function addGreeting() {
    var row = el("div", "msg bot"); var b = el("div", "bubble");
    b.appendChild(el("div", "", "안녕하세요, 비나세이프예요. 위에서 공정을 고르고 궁금한 것을 물어보세요. 샘플 문서나 법령에 근거가 있는 내용만 답하고, 없으면 담당자 확인이 필요하다고 알려드려요."));
    b.appendChild(el("div", "note", "법령 근거: 산업안전보건법(시행 2026.10.27), 근로기준법(시행 2026.10.8). 국가법령정보센터, 2026-11-26 열람. 조문만 안내하며 개별 사건의 판단은 하지 않아요. \"신입이 하지 말아야 할 것\"은 교수님 인터뷰와 법령 기반 안내예요."));

  function srcCard(s, ref) {

    [["(법령)", "법령", "lawb"], ["(인터뷰)", "교수님 인터뷰", "ivb"], ["(일반)", "별도 근거 없음", "nob"]].forEach(function (bd) {

  }
  function saveLog(entry) {
    try { var k = "binasafe_feedback", l = JSON.parse(localStorage.getItem(k) || "[]"); l.push(entry); localStorage.setItem(k, JSON.stringify(l.slice(-200))); } catch (e) {}
  }
  function addBot(question, process, r) {
    var row = el("div", "msg bot"); var b = el("div", "bubble");
    if (r.status === "GREETING") {
      b.textContent = "안녕하세요! 공정을 고르고 궁금한 안전 수칙을 물어보세요.";
      b.className = "bubble plain";
    } else {
      if (r.emergency) b.appendChild(el("div", "banner danger", "⚠ " + NOTICE));
      if (r.status === "NEEDS_CONFIRMATION") b.appendChild(el("div", "banner warn", "⚠ " + r.warning));
      if (r.status === "OUT_OF_SCOPE") b.appendChild(el("div", "banner info", r.warning));
      if (r.status === "OK") {
        var ul = el("ul", "ans"); r.answer.forEach(function (a) { ul.appendChild(el("li", "", a)); }); b.appendChild(ul);
      }
      if (r.note) b.appendChild(el("div", "note", r.note));
      if (r.sources && r.sources.length) {
        var d = el("details", "src"); d.open = !r.compact;
        d.appendChild(el("summary", "", "근거 문서 (" + r.sources.length + ")"));
        r.sources.forEach(function (s) { d.appendChild(srcCard(s, false)); }); b.appendChild(d);
      }
      if (r.related && r.related.length) {
        var d2 = el("details", "src");
        d2.appendChild(el("summary", "", "참고할 수 있는 관련 문서 (직접적인 답은 아님)"));
        r.related.forEach(function (s) { d2.appendChild(srcCard(s, true)); }); b.appendChild(d2);
      }
      if (r.status !== "OUT_OF_SCOPE") {
        var rate = el("div", "rate"); rate.appendChild(el("span", "", "도움이 됐나요?"));
        var up = el("button", "", "👍"), dn = el("button", "", "👎"), thx = el("span", "thx", "");

        rate.appendChild(up); rate.appendChild(dn); rate.appendChild(thx); b.appendChild(rate);

    }

  }
  function send(text) {

    tb.setAttribute("aria-label", "답변 작성 중");
    tb.appendChild(el("span", "dot")); tb.appendChild(el("span", "dot")); tb.appendChild(el("span", "dot"));
    typing.appendChild(tb); main.appendChild(typing); scrollDown();
    var proc = state.process;
    setTimeout(function () {
      var r = askBot(proc, q);
      if (typing.parentNode) typing.parentNode.removeChild(typing);
      addBot(q, proc, r);
      state.busy = false; sendBtn.disabled = !input.value.trim();
    }, 550);
  }
  function renderChat() {
    main.textContent = ""; addGreeting();
  }
  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; }

  input.addEventListener("input", function () { sendBtn.disabled = state.busy || !input.value.trim(); autosize(); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); }
  });
  sendBtn.onclick = function () { send(input.value); };
  $("clear").onclick = function () { renderChat(); };

  /* ===== 체크리스트 화면 ===== */
  function itemsFor(p) {
    var own = (CHECKLISTS[p] || []).map(function (s) {
      var a = s.split("|"); var d = BY_ID[a[0]]; return { key: s, text: a[1] || CHECK_TEXT[a[0]] || d.summary, doc: d, group: p };
    });
    var com = COMMON.map(function (id) { return { key: id, text: CHECK_TEXT[id], doc: BY_ID[id], group: "전 공정 공통" }; });
    return own.concat(com);
  }
  function renderChecklist() {
    main.textContent = "";
    var p = state.process;
    var items = itemsFor(p);
    var st = state.checks[p] || (state.checks[p] = {});
    main.appendChild(el("div", "ck-head", p === "전체" ? "전 공정 공통 작업 전 확인" : p + " 작업 전 확인"));
    main.appendChild(el("div", "ck-sub", p === "전체" ? "공정을 고르면 그 공정의 확인 항목이 함께 나와요." : (items.length === COMMON.length ? "이 공정의 체크리스트는 아직 없어요. 공통 항목만 확인하세요." : "공정 항목 " + (items.length - COMMON.length) + "개 + 공통 항목 " + COMMON.length + "개를 모두 확인하세요.")));
    var meter = el("div", "meter"); var bar = el("i"); meter.appendChild(bar); main.appendChild(meter);
    var prog = el("div", "ck-sub", ""); main.appendChild(prog);
    var ready = el("div", "ready hidden", "✅ 작업 준비 완료"); ready.setAttribute("role", "status");
    function update() {
      var n = items.filter(function (it) { return st[it.key]; }).length;
      prog.textContent = n + " / " + items.length + " 확인";
      bar.style.width = (items.length ? (n / items.length * 100) : 0) + "%";
      ready.classList.toggle("hidden", n !== items.length);
    }
    var last = null;
    items.forEach(function (it, i) {
      if (it.group !== last) { main.appendChild(el("div", "group-t", it.group === "전 공정 공통" ? "전 공정 공통" : it.group)); last = it.group; }
      var row = el("label", "ck" + (st[it.key] ? " done" : ""));
      var cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!st[it.key];
      cb.onchange = function () { st[it.key] = cb.checked; row.classList.toggle("done", cb.checked); update(); };
      var box = el("div", "");
      box.appendChild(el("div", "t", (i + 1) + ". " + it.text));
      box.appendChild(el("div", "s", "근거: " + it.doc.doc + " " + it.doc.clause + " — “" + it.doc.excerpt + "”"));
      row.appendChild(cb); row.appendChild(box); main.appendChild(row);
    });
    main.appendChild(ready); update(); main.scrollTop = 0;
  }

  /* ===== 탭 / 공정 ===== */
  function setTab(t) {
    state.tab = t;
    $("tab-chat").setAttribute("aria-selected", t === "chat");
    $("tab-check").setAttribute("aria-selected", t === "check");
    $("composer").classList.toggle("hidden", t !== "chat");
    if (t === "chat") { renderChat(); } else { renderChecklist(); }
  }
  $("tab-chat").onclick = function () { setTab("chat"); };
  $("tab-check").onclick = function () { setTab("check"); };
  function buildProcs() {
    var w = $("procs"); w.textContent = "";
    PROCESSES.forEach(function (p) {
      var b = el("button", "", p); b.type = "button"; b.setAttribute("aria-pressed", String(p === state.process));
      b.onclick = function () {
        state.process = p; buildProcs(); $("procLabel").textContent = "공정: " + p + " · Enter 전송 / Shift+Enter 줄바꿈";
        if (state.tab === "check") renderChecklist();
      };
      w.appendChild(b);
    });
  }
  buildProcs(); renderChat();
})();

<script>/* 베트남어 토글 */
(() => {
  if (window.__viToggleLoaded) return; window.__viToggleLoaded = true;
  const HAN = /[가-힣]/, KEY = 'vina_vi_cache_v1', PREF = 'vina_vi_on';
  const ATTRS = ['placeholder', 'aria-label', 'title'];
  let on = false;

  /* 나무(🌿) 장식 제거 */
  const st = document.createElement('style');
  st.textContent = 'header::after,[role=banner]::after{content:none!important;display:none!important}';
  document.head.appendChild(st);

  /* ---------- 번역 캐시 (localStorage 에 저장되어 새로고침 후에도 즉시 적용) ---------- */
  let cache = new Map();
  try { cache = new Map(Object.entries(JSON.parse(localStorage.getItem(KEY) || '{}'))); } catch (e) {}
  let saveTimer = 0;
  const save = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(Object.fromEntries(cache))); } catch (e) {} }, 400); };

  const API = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=vi&dt=t&q=';
  async function gtx(q) {
    const r = await fetch(API + encodeURIComponent(q));
    const j = await r.json();
    return j[0].map(x => x[0]).join('');
  }
  /* 여러 문장을 한 번의 요청으로 묶어서 번역 (줄바꿈으로 구분) */
  async function translateChunk(list) {
    try {
      const out = (await gtx(list.join('\n'))).split('\n');
      if (out.length === list.length) { list.forEach((t, i) => cache.set(t, out[i].trim() || t)); return; }
    } catch (e) {}
    await Promise.all(list.map(async t => { try { cache.set(t, await gtx(t)); } catch (e) {} }));
  }
  async function translateMany(texts) {
    const todo = [...new Set(texts.map(t => t.trim()))].filter(t => t && HAN.test(t) && !t.includes('\n') && !cache.has(t));
    const chunks = []; let cur = [], len = 0;
    for (const t of todo) {
      if (len + t.length > 1500 || cur.length >= 25) { chunks.push(cur); cur = []; len = 0; }
      cur.push(t); len += t.length + 1;
    }
    if (cur.length) chunks.push(cur);
    let i = 0;
    await Promise.all(Array.from({ length: 6 }, async () => { while (i < chunks.length) await translateChunk(chunks[i++]); }));
    if (todo.length) save();
  }
  /* 요청 모아서 보내기 (짧은 시간 안에 생긴 새 문구를 한 번에) */
  let queue = new Set(), qTimer = 0, qWaiters = [];
  function need(texts) {
    return new Promise(res => {
      texts.forEach(t => queue.add(t)); qWaiters.push(res);
      if (!qTimer) qTimer = setTimeout(async () => {
        const q = [...queue], w = qWaiters; queue = new Set(); qWaiters = []; qTimer = 0;
        await translateMany(q); w.forEach(f => f());
      }, 15);
    });
  }

  /* ---------- DOM 적용 / 복원 ---------- */
  const orig = new Map(), origAttr = new Map(), last = new WeakMap();
  const skip = n => { const p = n.parentElement; return !p || /^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA)$/.test(p.tagName) || !!p.closest('#vi-toggle'); };

  function applyNode(nd, misses) {
    if (!on || skip(nd)) return;
    const val = nd.nodeValue;
    if (!HAN.test(val) || last.get(nd) === val) return;
    const t = val.trim(), v = cache.get(t);
    if (v === undefined) { misses && misses.push(t); return; }
    const lead = val.match(/^\s*/)[0], trail = val.match(/\s*$/)[0];
    orig.set(nd, val);
    const nv = lead + v + trail; last.set(nd, nv); nd.nodeValue = nv;
  }
  function applyAttr(el, misses) {
    if (!on || el.closest('#vi-toggle')) return;
    for (const a of ATTRS) {
      const val = el.getAttribute(a);
      if (!val || !HAN.test(val)) continue;
      const v = cache.get(val.trim());
      if (v === undefined) { misses && misses.push(val.trim()); continue; }
      const m = origAttr.get(el) || {}; m[a] = val; origAttr.set(el, m); el.setAttribute(a, v);
    }
  }
  function scan(root, misses) {
    if (root.nodeType === 3) return applyNode(root, misses);
    if (root.nodeType !== 1 && root.nodeType !== 9) return;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
    while ((n = w.nextNode())) applyNode(n, misses);
    if (root.querySelectorAll) { applyAttr(root, misses); root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(e => applyAttr(e, misses)); }
  }
  async function scanAll(root) {
    const misses = []; scan(root, misses);
    if (misses.length) { await need(misses); if (on) scan(root); }
  }
  function restore() {
    orig.forEach((o, nd) => { nd.nodeValue = o; }); orig.clear();
    origAttr.forEach((m, el) => { for (const a in m) el.setAttribute(a, m[a]); }); origAttr.clear();
  }

  /* 화면이 바뀔 때마다 즉시(그려지기 전에) 처리 → 한글이 번쩍이거나 남지 않음 */
  new MutationObserver(recs => {
    if (!on) return;
    const misses = [];
    for (const r of recs) {
      if (r.type === 'characterData') applyNode(r.target, misses);
      else if (r.type === 'attributes') applyAttr(r.target, misses);
      else r.addedNodes.forEach(n => scan(n, misses));
    }
    if (misses.length) need(misses).then(() => { if (on) scan(document.body); });
  }).observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  /* ---------- 버튼 ---------- */
  const btn = document.createElement('button'); btn.id = 'vi-toggle'; btn.type = 'button';
  const paint = () => {
    const c = on ? '#2e9e4a' : '#8a9a8f';
    btn.innerHTML = '<span style="font-size:15px">🇻🇳</span> Tiếng Việt <b style="margin-left:4px;padding:2px 8px;border-radius:999px;background:' + c + ';color:#fff;font-size:11px">' + (on ? 'ON' : 'OFF') + '</b>';
    btn.setAttribute('aria-pressed', String(on));
    btn.style.background = on ? '#fff' : 'rgba(255,255,255,.88)';
    btn.style.outline = on ? '2px solid #2e9e4a' : 'none';
  };
  btn.style.cssText = 'position:absolute;top:12px;right:14px;z-index:50;display:flex;align-items:center;gap:4px;padding:6px 10px;border:0;border-radius:999px;font-weight:700;font-size:13px;font-family:inherit;color:#1f5d2f;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15)';
  async function setOn(v) {
    on = v; paint(); try { localStorage.setItem(PREF, v ? '1' : '0'); } catch (e) {}
    document.documentElement.lang = on ? 'vi' : 'ko';
    if (on) { btn.style.opacity = .7; await scanAll(document.body); btn.style.opacity = 1; } else restore();
  }
  btn.onclick = () => setOn(!on);
  const host = document.querySelector('header,[role=banner]') || document.body;
  if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
  host.appendChild(btn); paint();

  /* ---------- 미리 번역해 두기 (페이지 스크립트 안의 모든 한글 문구) ---------- */
  function literals() {
    const set = new Set(), src = [...document.scripts].map(s => s.textContent).join('\n');
    for (const m of src.matchAll(/"((?:[^"\\\n]|\\.)*)"|'((?:[^'\\\n]|\\.)*)'/g)) {
      let s = m[1] ?? m[2]; if (!HAN.test(s)) continue;
      try { s = JSON.parse('"' + s.replace(/\\'/g, "'").replace(/"/g, '\\"') + '"'); } catch (e) {}
      set.add(s);
    }
    const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT); let n;
    while ((n = w.nextNode())) if (!skip(n) && HAN.test(n.nodeValue)) set.add(n.nodeValue.trim());
    return [...set];
  }
  
  /* 탭·공정 화면을 한 번씩 훑어서(눈에 안 보이게 즉시) 그 화면의 문구도 미리 번역 */
  function crawlTexts() {
    const out = new Set();
    const grab = () => { const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT); let n;
      while ((n = w.nextNode())) if (!skip(n) && HAN.test(n.nodeValue)) out.add(n.nodeValue.trim()); };
    const tabs = [...document.querySelectorAll('[role=tab]')];
    const selTab = tabs.findIndex(t => t.getAttribute('aria-selected') === 'true');
    const chipSel = () => [...document.querySelectorAll('[role=group]:not(#fs-toggle) button')];
    const active = () => chipSel().findIndex(b => b.getAttribute('aria-pressed') === 'true' || b.getAttribute('aria-checked') === 'true' || b.classList.contains('active') || b.classList.contains('on') || b.classList.contains('selected'));
    const selChip = active();
    try {
      tabs.forEach(t => { t.click(); const n = chipSel().length; for (let i = 0; i < n; i++) { chipSel()[i].click(); grab(); } });
    } catch (e) {}
    if (selChip >= 0 && chipSel()[selChip]) chipSel()[selChip].click(); else if (chipSel()[0]) chipSel()[0].click();
    if (selTab >= 0 && tabs[selTab]) tabs[selTab].click();
    return [...out];
  }
  const warm = () => translateMany(literals()).then(() => translateMany(crawlTexts())).then(() => { if (on) scan(document.body); });
  setTimeout(warm, 200);
  if (localStorage.getItem(PREF) === '1') setOn(true);
})()
</script>
<script>/* 글자 크기 */
(() => {
  if (window.__fsLoaded) return; window.__fsLoaded = true;
  const KEY = 'vina_font_step';
  const STEPS = [
    { label: 'A', px: 12, scale: 1,    title: '기본 글자 크기' },
    { label: 'A', px: 15, scale: 1.15, title: '크게' },
    { label: 'A', px: 19, scale: 1.3,  title: '아주 크게' }
  ];
  let step = Number(localStorage.getItem(KEY)); if (!(step >= 0 && step < STEPS.length)) step = 0;

  const apply = () => {
    document.documentElement.style.fontSize = (16 * STEPS[step].scale) + 'px';   /* 페이지가 rem 단위라 전체가 같이 커짐 */
    box.querySelectorAll('button').forEach((b, i) => {
      b.setAttribute('aria-pressed', String(i === step));
      b.style.background = i === step ? '#2e9e4a' : 'transparent';
      b.style.color = i === step ? '#fff' : '#1f5d2f';
    });
    try { localStorage.setItem(KEY, String(step)); } catch (e) {}
  };

  const box = document.createElement('div');
  box.id = 'fs-toggle'; box.setAttribute('role', 'group'); box.setAttribute('aria-label', '글자 크기');
  box.style.cssText = 'display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.88);box-shadow:0 2px 0 rgba(0,0,0,.15)';
  STEPS.forEach((s, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = s.label; b.title = s.title; b.setAttribute('aria-label', s.title);
    b.style.cssText = 'border:0;border-radius:999px;width:30px;height:28px;cursor:pointer;font-family:inherit;font-weight:800;line-height:1;font-size:' + s.px + 'px';
    b.onclick = () => { step = i; apply(); };
    box.appendChild(b);
  });

  /* 우측 상단 도구 묶음: [A A A] [🇻🇳 Tiếng Việt] */
  const host = document.querySelector('header,[role=banner]') || document.body;
  if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
  let tools = document.getElementById('top-tools');
  if (!tools) {
    tools = document.createElement('div'); tools.id = 'top-tools';
    tools.style.cssText = 'position:absolute;top:12px;right:14px;z-index:50;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end';
    host.appendChild(tools);
  }
  tools.appendChild(box);
  const vi = document.getElementById('vi-toggle');
  if (vi) { vi.style.position = 'static'; tools.appendChild(vi); }
  apply();
})()
</script>
<script>/* 피드백 */
(() => {
  if (window.__fbLoaded) return; window.__fbLoaded = true;
  const KEY = 'binasafe_feedback';
  const REASONS = ['답이 틀린 것 같아요', '이해하기 어려워요', '근거가 부족해요', '내 상황과 달라요', '기타'];
  const rd = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } };
  const wr = l => { try { localStorage.setItem(KEY, JSON.stringify(l.slice(-200))); } catch (e) {} };

  const st = document.createElement('style');
  st.textContent = [
    '.rate button{transition:transform .08s,background .15s}.rate button:active{transform:scale(.9)}',
    '.rate button[aria-pressed=true]{background:#e4f6ea;border-color:#2e9e4a}',
    '.rate button[aria-pressed=true][aria-label*="안 됐"],.rate button[aria-pressed=true][aria-label*="không"]{background:#fff0e0;border-color:#e8912c}',
    '.fb-form{margin-top:10px;padding:10px 12px;border-radius:14px;background:#fffaf0;border:2px dashed #f0c987}',
    '.fb-form .fb-q{font-weight:700;font-size:.88rem;margin-bottom:6px}',
    '.fb-chips{display:flex;flex-wrap:wrap;gap:6px}',
    '.fb-chips button{border:2px solid #d9e8b8;background:#fff;border-radius:999px;padding:5px 11px;font:inherit;font-size:.82rem;cursor:pointer;color:#1f5d2f}',
    '.fb-chips button[aria-pressed=true]{background:#2e9e4a;border-color:#2e9e4a;color:#fff}',
    '.fb-form textarea{width:100%;box-sizing:border-box;margin-top:8px;border:2px solid #d9e8b8;border-radius:12px;padding:7px 10px;font:inherit;font-size:.85rem;resize:vertical;min-height:38px}',
    '.fb-actions{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}',
    '.fb-send{border:0;border-radius:999px;padding:6px 16px;background:#2e9e4a;color:#fff;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.18)}',
    '.fb-send:disabled{opacity:.5;cursor:default}',
    '.fb-safe{font-size:.78rem;color:#7a5200}',
    '.fb-done{margin-top:8px;font-size:.85rem;color:#17673a;font-weight:700}',
    '#fb-export{border:0;background:none;font:inherit;font-size:inherit;color:inherit;text-decoration:underline;cursor:pointer;opacity:.85;margin-right:12px}'
  ].join('');
  document.head.appendChild(st);

  let seq = 0;
  const mid = bubble => bubble.dataset.mid || (bubble.dataset.mid = 'm' + Date.now() + '_' + (seq++));

  function upsert(bubble, patch) {          /* 같은 답변에 대한 피드백은 1건만 유지(수정하면 덮어쓰기) */
    const id = mid(bubble); let l = rd(), cur = l.filter(e => e.mid === id).pop();
    l = l.filter(e => e.mid !== id);
    l.push(Object.assign({}, cur, patch, { mid: id }));
    wr(l);
  }

  document.addEventListener('click', e => {
    const btn = e.target.closest && e.target.closest('.rate button'); if (!btn) return;
    const bubble = btn.closest('.bubble'), rate = btn.closest('.rate'); if (!bubble) return;
    const isUp = btn === rate.querySelectorAll('button')[0];
    /* 앱이 방금 남긴 기본 로그를 우리 형식으로 교체 */
    let l = rd(), appEntry = l.pop();
    if (appEntry && !appEntry.mid) { const id = mid(bubble); l = l.filter(x => x.mid !== id); const prev = rd().filter(x => x.mid === id).pop(); l.push(Object.assign({}, appEntry, { mid: id }, prev && prev.rating === appEntry.rating ? { reason: prev.reason, comment: prev.comment } : {})); wr(l); }
    let form = bubble.querySelector('.fb-form'); if (form) form.remove();
    const thx = rate.querySelector('.thx');
    if (isUp) { if (thx) thx.textContent = '고마워요! 의견이 저장됐어요.'; upsert(bubble, { reason: '', comment: '' }); return; }
    if (thx) thx.textContent = '';
    form = document.createElement('div'); form.className = 'fb-form';
    form.innerHTML = '<div class="fb-q">어떤 점이 아쉬웠나요? (선택)</div><div class="fb-chips"></div><textarea rows="2" maxlength="200" placeholder="자세히 알려주시면 더 좋아요 (선택)"></textarea><div class="fb-actions"><button type="button" class="fb-send">보내기</button><span class="fb-safe">⚠ 위험하거나 급하면 기다리지 말고 담당자에게 바로 알려주세요.</span></div>';
    const chips = form.querySelector('.fb-chips'); let picked = [];
    REASONS.forEach(r => { const c = document.createElement('button'); c.type = 'button'; c.textContent = r; c.setAttribute('aria-pressed', 'false');
      c.onclick = () => { const on = c.getAttribute('aria-pressed') !== 'true'; c.setAttribute('aria-pressed', String(on)); picked = on ? picked.concat(r) : picked.filter(x => x !== r); }; chips.appendChild(c); });
    form.querySelector('.fb-send').onclick = () => {
      upsert(bubble, { reason: picked.join(' / '), comment: form.querySelector('textarea').value.trim() });
      form.innerHTML = '<div class="fb-done">✔ 의견 고마워요. 담당자가 확인하고 답변을 고칠게요.</div>';
    };
    rate.insertAdjacentElement('afterend', form);
  });

  /* 모아 둔 피드백 내려받기 (담당자가 검토용) */
  const clearBtn = [...document.querySelectorAll('button')].find(b => b.textContent.includes('대화 지우기'));
  if (clearBtn) {
    const ex = document.createElement('button'); ex.id = 'fb-export'; ex.type = 'button';
    const label = () => { const n = rd().length; ex.textContent = '피드백 내보내기 (' + n + ')'; };
    label(); ex.onclick = () => {
      const l = rd(), q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      const head = ['시간', '공정', '질문', '응답상태', '평가', '아쉬운 점', '의견'];
      const csv = '\ufeff' + [head.map(q).join(',')].concat(l.map(e => [e.time, e.process, e.question, e.status, e.rating === 'up' ? '도움됨' : '도움 안 됨', e.reason, e.comment].map(q).join(','))).join('\r\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      a.download = 'vinasafe_feedback_' + new Date().toISOString().slice(0, 10) + '.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    };
    clearBtn.parentElement.insertBefore(ex, clearBtn);
    document.addEventListener('click', () => setTimeout(label, 50), true);
  }
})()
</script>
</body>
</html>
